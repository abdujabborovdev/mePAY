<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f4f6fa; padding:24px; }
    .card { max-width:360px; margin:60px auto; background:#fff; border-radius:16px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
    input { width:100%; box-sizing:border-box; padding:12px; margin:6px 0 12px; border:1px solid #ccd; border-radius:10px; font-size:16px; }
    button { width:100%; padding:12px; background:#00b5ef; color:#fff; border:0; border-radius:10px; font-size:16px; cursor:pointer; }
    .err { color:#c00; }
  </style>
</head>
<body>
<div class="card">
  <h2>Kirish</h2>
  {% if form.errors %}<p class="err">Login yoki parol noto'g'ri.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Login</label>{{ form.username }}
    <label>Parol</label>{{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Kirish</button>
  </form>
</div>
</body>
</html>
